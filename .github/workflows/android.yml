name: Android release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build signed release APK
        env:
          LRC_KEYSTORE: ${{ runner.temp }}/release.keystore
          LRC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LRC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LRC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/release/app-release.apk "lrc-editor-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: android/lrc-editor-${{ github.ref_name }}.apk
          generate_release_notes: true
